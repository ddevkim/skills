<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<!-- Non-blocking: a slow or offline font server must not hold the renderer script. -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root {
  --bg: #fff; --soft: #f9f9f9; --card: #fff;
  --text: rgba(0,0,0,.9); --text-2: rgba(0,0,0,.6); --text-3: rgba(0,0,0,.47);
  --line: rgba(0,0,0,.12); --shadow: 0 4px 20px rgba(0,0,0,.075);
  --clay: #d97757; --clay-strong: #c6613f; --clay-bg: rgba(217,119,87,.12);
  --good: #006c10; --good-bg: rgba(16,161,34,.14);
  --bad: #a42528; --bad-bg: rgba(220,60,61,.12);
  --watch: #794c02; --watch-bg: rgba(251,179,21,.16);
  --idle-bg: rgba(0,0,0,.05);
  --serif: "Noto Serif KR", Georgia, "Times New Roman", serif;
  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #151515; --soft: #0b0b0b; --card: #1f1f1f;
  --text: rgba(255,255,255,.93); --text-2: rgba(255,255,255,.57); --text-3: rgba(255,255,255,.4);
  --line: rgba(255,255,255,.12); --shadow: none; --idle-bg: rgba(255,255,255,.06);
  --good: #53c556; --bad: #f17778; --watch: #e49c06; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #151515; --soft: #0b0b0b; --card: #1f1f1f;
  --text: rgba(255,255,255,.93); --text-2: rgba(255,255,255,.57); --text-3: rgba(255,255,255,.4);
  --line: rgba(255,255,255,.12); --shadow: none; --idle-bg: rgba(255,255,255,.06);
  --good: #53c556; --bad: #f17778; --watch: #e49c06; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.55 var(--sans); word-break: keep-all; overflow-wrap: anywhere; }
main { max-width: 1180px; margin: 0 auto; padding: 0 16px 48px; }
h1, h2 { font-family: var(--serif); font-weight: 400; margin: 0; text-wrap: balance; }
h1 { font-size: 32px; line-height: 1.25; margin-top: 20px; }
h2 { font-size: 22px; line-height: 1.3; margin-bottom: 14px; }
h3 { font-size: 13px; font-weight: 600; color: var(--text-2); margin: 12px 0 4px; }
/* overall progress: checkpoints reached over 8 per PR; green merged, clay reached but not merged */
.prog { display: flex; align-items: center; gap: 12px; padding-top: 14px; }
.prog-track { flex: 1 1 auto; min-width: 0; height: 10px; border-radius: 999px; background: var(--idle-bg); overflow: hidden; display: flex; }
.prog-done { background: var(--good); } .prog-move { background: var(--clay); }
.prog-text { flex: 0 0 auto; font-size: 13px; color: var(--text-2); white-space: nowrap; } .prog-text b { color: var(--text); font-weight: 600; }
.meta { font-size: 13px; color: var(--text-2); border-bottom: 1px solid var(--line); padding: 12px 0; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 20px; }
.num { font-size: 40px; font-weight: 500; line-height: 1; white-space: nowrap; }
.pill { display: inline-block; border-radius: 999px; padding: 2px 10px; font-size: 13px; font-weight: 500; white-space: nowrap; }
.good { color: var(--good); background: var(--good-bg); } .bad { color: var(--bad); background: var(--bad-bg); } .watch { color: var(--watch); background: var(--watch-bg); }
.clay { color: var(--clay-strong); background: var(--clay-bg); } .idle { color: var(--text-2); background: var(--idle-bg); }
section { margin-top: 28px; }
.ask { margin-top: 14px; padding: 14px 18px; border-left: 4px solid var(--clay); background: var(--clay-bg); border-radius: 10px; font-size: 16px; }
.ask b { color: var(--clay-strong); }
.ask.calm { border-left-color: var(--good); background: var(--good-bg); }
/* the developer's to-do list: one row per thing only they can do */
ol.todo { list-style: none; padding: 0; margin: 10px 0 0; counter-reset: todo; }
ol.todo li { counter-increment: todo; padding: 10px 0 10px 34px; border-top: 1px solid var(--line); position: relative; font-size: 15px; }
ol.todo li::before { content: counter(todo); position: absolute; left: 0; top: 10px; width: 24px; height: 24px; border-radius: 999px; background: var(--clay-strong); color: #fff; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center; }
ol.todo .how { font-size: 13px; color: var(--text-2); margin-top: 4px; }
ol.todo .opts { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 6px; }
.opt { border: 1px solid var(--line); border-radius: 8px; padding: 2px 8px; font-size: 13px; background: var(--card); }
.opt.rec { border-color: var(--clay); }
.refs { margin-top: 12px; font-size: 13px; color: var(--text-2); display: flex; flex-wrap: wrap; gap: 4px 14px; }
/* stage strip: where every PR is, left to right */
.stages { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 18px; }
.stage { flex: 1 1 110px; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--card); }
.stage .n { font-size: 28px; font-weight: 500; line-height: 1.1; }
.stage .lbl { font-size: 13px; color: var(--text-2); }
.stage .ids { font-size: 13px; margin-top: 4px; min-height: 18px; display: flex; flex-wrap: wrap; gap: 2px 8px; }
.stage.zero { background: var(--soft); } .stage.zero .n { color: var(--text-3); }
.stage.you { border-color: var(--bad); background: var(--bad-bg); } .stage.you .n { color: var(--bad); }
.stage.done { border-color: var(--good); } .stage.done .n { color: var(--good); }
.node:target { outline: 3px solid var(--clay); outline-offset: 2px; }
ul.know { margin: 14px 0 0; padding: 0 0 0 20px; font-size: 15px; } ul.know li { margin: 4px 0; }
/* flow */
.lane { margin-bottom: 18px; }
.lane-h { font-size: 13px; color: var(--text-2); margin-bottom: 8px; font-weight: 600; }
.flow { display: flex; flex-wrap: wrap; align-items: stretch; gap: 8px; }
.node { min-width: 180px; flex: 1 1 180px; max-width: 260px; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--card); }
.node.s-merged { border-color: var(--good); }
.node.s-active, .node.s-pr, .node.s-hub { border-color: var(--clay); box-shadow: 0 0 0 2px var(--clay-bg); }
.node.s-review { border-color: var(--watch); box-shadow: 0 0 0 2px var(--watch-bg); }
.node.s-ready { border-color: var(--good); box-shadow: 0 0 0 2px var(--good-bg); }
.node.s-walk, .node.s-you { border-color: var(--bad); box-shadow: 0 0 0 2px var(--bad-bg); }
.node.s-blocked { border-color: var(--bad); }
.node .pills { display: flex; flex-wrap: wrap; gap: 4px; }
.now { margin-top: 8px; font-size: 13px; line-height: 1.4; color: var(--text-2); }
.now .pill { margin-bottom: 4px; }
.node .pill, ol.todo .pill, .items .pill { white-space: normal; } /* a long label wraps inside its card */
.now .age { color: var(--text-3); font-size: 12px; margin-top: 2px; }
.warnbar { border-left-color: var(--bad); background: var(--bad-bg); }
.node .id { font-size: 13px; color: var(--text-3); font-weight: 600; }
.node .t { font-size: 14px; line-height: 1.35; margin: 4px 0 8px; }
.node .sofar { font-size: 13px; line-height: 1.45; margin: 0 0 8px; padding-left: 8px; border-left: 2px solid var(--line); }
.node .ext { font-size: 13px; color: var(--text-3); margin-top: 6px; }
.arrow { align-self: center; color: var(--text-3); flex: 0 0 auto; }
.legend { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
/* checklist */
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 720px; font-size: 14px; }
th, td { border-bottom: 1px solid var(--line); padding: 10px 8px; text-align: center; }
th { font-size: 13px; color: var(--text-2); font-weight: 600; }
td.l, th.l { text-align: left; }
.box { display: inline-flex; width: 20px; height: 20px; border-radius: 5px; border: 1.5px solid var(--line); align-items: center; justify-content: center; vertical-align: middle; }
.box.on { background: var(--good); border-color: var(--good); }
.box.now { border-color: var(--clay); background: var(--clay-bg); }
.box.late { border-color: var(--bad); border-style: dashed; }
.box svg { width: 14px; height: 14px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 12px; }
ul.items { list-style: none; padding: 0; margin: 0; }
ul.items li { padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
ul.items li:last-child { border-bottom: 0; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
a { color: var(--clay-strong); }
</style>
</head>
<body>
<main id="app"></main>
<script>
/* Fixed renderer. Never edit this file: the hub edits state.js, sync.cjs writes live.js.
   Both are re-read every few seconds with <script> tags, because fetch() of local files is blocked on file://. */
const POLL_MS = 5000, SYNC_STALE_MIN = 2, STOPPED_MIN = 5, SAME_STEP_MIN = 30;
/* Every text the page writes itself, per language. HUB_STATE.lang picks one ("ko" when absent or unknown).
   Arguments arrive already escaped. A new language is one more table with the same keys. */
const L10N = {
  ko: {
    lang: "ko", docTitle: t => `${t} 진행`,

    phases: ["시험 실패 확인", "구현 통과", "전체 검증", "독립 리뷰 통과", "워크스루 승인", "PR 열림", "CI 통과", "병합"],
    st: { todo: "대기", active: "작업 중", walk: "워크스루 대기", pr: "PR 열림·CI", review: "리뷰 중", ready: "병합 준비됨", merged: "병합됨", blocked: "막힘" },
    stage: { todo: "대기", active: "작업 중", review: "독립 리뷰", walk: "워크스루 대기", pr: "PR 열림·CI", ready: "병합 준비됨", merged: "병합됨" },
    msg: { worker_done: "작업자 완료 보고", ask: "작업자 질문", question: "작업자 질문", escalation: "작업자 멈춤 알림" },
    dec: { open: "결정 필요", watching: "확인 중", answered: "답함" },
    waitsMerge: "병합 승인 대기", needWalk: "워크스루 필요", needReview: "독립 리뷰 필요",
    walkLink: "워크스루 보기", openPr: "PR 열기", specLink: "작업 명세", specDoc: "기능 명세", protocolDoc: "작업자 규약",
    justNow: "방금", minAgo: m => `${m}분 전`, hAgo: (h, m) => `${h}시간 ${m}분 전`,
    waitReason: r => `입력 대기: ${r}`, wait: "입력 대기", waitMin: m => `입력 대기 ${m}분`,
    kWait: "입력 대기", kNeed: "직접 할 일", kDec: "결정", kWalk: "워크스루 승인", kMerge: "병합 승인", kBlocked: "막힘",
    waitText: (id, w) => `작업자 ${id} 가 터미널에서 답을 기다립니다 (${w}).`, waitHow: "Orca 사이드바에서 그 작업자를 열어 답합니다.",
    needHow: "끝나면 허브 대화에 알려 줍니다.", recommend: " · 허브 권장", decHow: "허브 대화에서 답합니다.", decWaits: ids => ` 이 답을 기다리는 작업: ${ids}`,
    walkHow: "워크스루를 읽고 허브 대화에서 승인하거나 질문합니다. 승인해야 PR 이 열립니다.", changed: "승인 뒤 변경",

    headAllMerged: (t, n) => `${t}: PR ${n}개를 모두 병합했다`, headTodo: (t, o, n) => `${t}: ${o}님이 할 일이 ${n}건 있다`, headNone: (t, o) => `${t}: 지금 ${o}님이 할 일은 없다`,
    stopped: m => `작업자 멈춤 ${m}분`, sameStep: m => `같은 단계 ${m}분째`,
    ciPass: "CI 통과", ciFail: n => `CI 실패 ${n}건`, ciPending: (p, t) => `CI 진행 중 ${p}/${t}`,
    startedPending: "작업자 시작됨 · 허브 반영 전", reportedPhase: p => `작업자 보고: ${p} · 허브 반영 전`, msgPending: m => `${m} · 허브 반영 전`,
    waitingPill: w => `기다림: ${w}`, afterLine: a => `먼저 끝나야 하는 작업: ${a}`, mergedVia: (pr, sha) => `PR ${pr} 로 병합했습니다${sha}`,
    syncDone: "동기화 종료(완료)", syncOff: "실시간 동기화 꺼짐", syncStale: m => `실시간 동기화가 ${m}분째 멈췄습니다`, syncLive: a => `실시간 · ${a}`, syncErr: e => `동기화 오류: ${e}`,
    askHead: o => `${o}님이 지금 할 일`, calm: o => `지금 ${o}님이 할 일은 없습니다.`,
    hubLag: (n, more, a) => `허브가 아직 반영하지 않은 작업자 메시지가 ${n}건${more ? " 이상" : ""} 있습니다(가장 오래된 것 ${a}). 카드의 "허브 반영 전" 표시가 작업자가 보고한 실제 단계입니다. 허브가 대화로 질문 중이거나 다른 일을 처리하는 중일 수 있습니다.`,
    stateBroken: "state.js 를 읽지 못해 직전 화면을 유지합니다. 허브가 파일을 고치는 중일 수 있습니다.",
    meta: (t, o, sha) => `${t} 진행 현황 · 허브 → ${o} · 기준 <span class="mono">${sha}</span>`, updated: at => `허브 갱신 ${at}`,
    refsLabel: "이 작업이 따르는 문서:", flowH: "개발 흐름",
    legend: ["병합됨·병합 준비됨", "작업 중·PR 열림", "리뷰 중·위험 표시·승인 뒤 변경", "대기", "막힘·승인 대기·입력 대기"],
    checkH: "PR별 체크포인트: 칸을 누르면 워크스루나 PR 이 열립니다", thPr: "PR", thLane: "레인",
    decidedH: "지금까지 정한 것", decidedNone: "아직 정한 것이 없다",
    workersH: (n, cap) => `작업자 ${n}명 작업 중 (동시 상한 ${cap}명)`, startedNew: "시작됨 · 허브 반영 전",
    hubGoes: "허브가 이어서 진행", level: { medium: "자율 단계: 중간", high: "자율 단계: 높음" },
    levelTip: { medium: "제품 결정과 병합 승인만 묻고, PR 은 워크스루를 기다리지 않고 엽니다.", high: "되돌릴 수 없는 작업 앞에서만 묻고, 제품 결정과 병합은 허브가 스스로 합니다." },
    hubDecH: "허브가 스스로 정한 것", yourDecH: o => `${o}님이 정한 것`, hubDecLine: n => `허브가 스스로 정한 것이 ${n}건 있습니다.`,
    progLabel: "전체 진행률", progMerged: (m, n) => `병합 ${m}/${n}`
  },
  en: {
    lang: "en", docTitle: t => `${t} progress`,
    noState: "Could not read state.js. Check that state.js is in this folder and has no syntax error.",
    phases: ["Test fails", "Code passes", "Full check", "Review passed", "Walkthrough OK", "PR open", "CI passed", "Merged"],
    st: { todo: "Waiting", active: "Working", walk: "Walkthrough waiting", pr: "PR open · CI", review: "In review", ready: "Ready to merge", merged: "Merged", blocked: "Blocked" },
    stage: { todo: "Waiting", active: "Working", review: "Review", walk: "Walkthrough waiting", pr: "PR open · CI", ready: "Ready to merge", merged: "Merged" },
    msg: { worker_done: "Worker done", ask: "Worker question", question: "Worker question", escalation: "Worker blocked" },
    dec: { open: "Needs decision", watching: "Checking", answered: "Answered" },
    waitsMerge: "Waiting for merge OK", needWalk: "Needs walkthrough", needReview: "Needs review",
    walkLink: "Walkthrough", openPr: "Open PR", specLink: "Task spec", specDoc: "Feature spec", protocolDoc: "Worker protocol",
    justNow: "just now", minAgo: m => `${m} min ago`, hAgo: (h, m) => `${h} h ${m} min ago`,
    waitReason: r => `Waiting for input: ${r}`, wait: "Waiting for input", waitMin: m => `Waiting for input ${m} min`,
    kWait: "Input", kNeed: "Your task", kDec: "Decision", kWalk: "Walkthrough", kMerge: "Merge", kBlocked: "Blocked",
    waitText: (id, w) => `Worker ${id} waits for an answer in its terminal (${w}).`, waitHow: "Open that worker in the Orca sidebar and answer.",
    needHow: "Tell the hub when it is done.", recommend: " · hub suggests", decHow: "Answer in the hub chat.", decWaits: ids => ` Waiting on this: ${ids}`,
    walkHow: "Read the walkthrough, then approve or ask in the hub chat. The PR opens after you approve.", changed: "Changed after OK",
    mergeHow: id => `Reply "merge ${id}" in the hub chat.`, blockedHow: "Decide in the hub chat how to unblock it.",
    headAllMerged: (t, n) => n === 1 ? `${t}: the PR is merged` : `${t}: all ${n} PRs are merged`,

    ciPass: "CI passed", ciFail: n => `CI failed: ${n}`, ciPending: (p, t) => `CI running ${p}/${t}`,
    startedPending: "Worker started · hub not updated", reportedPhase: p => `Worker says: ${p} · hub not updated`, msgPending: m => `${m} · hub not updated`,
    waitingPill: w => `Waiting: ${w}`, afterLine: a => `Must finish first: ${a}`, mergedVia: (pr, sha) => `Merged with PR ${pr}${sha}`,
    syncDone: "Sync ended (done)", syncOff: "Live sync off", syncStale: m => `Live sync has been stopped for ${m} min`, syncLive: a => `Live · ${a}`, syncErr: e => `Sync error: ${e}`,
    askHead: o => `What ${o} needs to do now`, calm: o => `${o} has nothing to do right now.`,
    hubLag: (n, more, a) => `${n}${more ? "+" : ""} worker ${n === 1 && !more ? "message is" : "messages are"} not yet in the hub (oldest ${a}). The "hub not updated" tags on the cards show the step the worker reported. The hub may be asking you something or busy with other work.`,
    stateBroken: "Could not read state.js, so this is the last good screen. The hub may be editing the file.",
    meta: (t, o, sha) => `${t} progress · hub → ${o} · base <span class="mono">${sha}</span>`, updated: at => `Hub updated ${at}`,
    refsLabel: "Documents this work follows:", flowH: "Work flow",
    legend: ["Merged · ready", "Working · PR open", "In review · risk · changed after OK", "Waiting", "Blocked · needs OK · waiting for input"],
    checkH: "Checkpoints per PR: click a box to open the walkthrough or PR", thPr: "PR", thLane: "Lane",
    decidedH: "Decided so far", decidedNone: "Nothing decided yet",
    workersH: (n, cap) => `${n} ${n === 1 ? "worker" : "workers"} working (limit ${cap})`, startedNew: "Started · hub not updated",
    hubGoes: "Hub carries on", level: { medium: "Autonomy: medium", high: "Autonomy: high" },
    levelTip: { medium: "You are asked for product decisions and merge approvals; PRs open without waiting for the walkthrough.", high: "You are asked only before irreversible actions; the hub decides product questions and merges on its own." },
    hubDecH: "Decided by the hub", yourDecH: o => `Decided by ${o}`, hubDecLine: n => `The hub decided ${n} ${n === 1 ? "question" : "questions"} on its own.`,
    progLabel: "Overall progress", progMerged: (m, n) => `Merged ${m}/${n}`
  }
};
let T = L10N.ko;
const REVIEW = 3, WALK = 4, PR = 5; // T.phases indexes that link somewhere
const ST = { todo: "idle", active: "clay", walk: "bad", pr: "clay", review: "watch", ready: "good", merged: "good", blocked: "bad" }; // status → tone
const PH_NUM = { red: 1, green: 2, verified: 3, "pr-open": 6, "ci-green": 7 }; // status --phase → phases (sync.cjs)
const HUB_LAG_MIN = 3; // older unhandled worker messages than this: the hub is behind
const DEC = { open: "bad", watching: "watch", answered: "good" };
const TONE = { active: "clay", support: "watch", done: "good" };
const check = '<svg viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.5l3 3 6-7"/></svg>';
const arrow = '<svg class="arrow" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 9h11M10 5l4 4-4 4"/></svg>';
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const app = document.getElementById("app");
const onMain = i => i.base === "main";
const waitsApproval = i => i.status === "ready" && onMain(i) && !i.walkPending && !i.reviewPending;
// state.js autonomy: "low" (default), "medium" (the hub carries walkthroughs on), "high" (it also merges ready PRs on main).
let LEVEL = "low";
const hubLed = i => (LEVEL !== "low" && i.status === "walk") || (LEVEL === "high" && waitsApproval(i));
const yours = i => waitsApproval(i) && !hubLed(i);
const walkHref = (i, step = 1) => /^[A-Za-z0-9_-]+-w\d+$/.test(String(i.walkthrough || "")) ? `walkthrough.html?w=${i.walkthrough}#${step}` : "";
const walkLink = i => walkHref(i) ? `<a href="${walkHref(i)}" target="_blank" rel="noopener">${T.walkLink}</a>` : "";
// The developer approved round walkApproved; a later round means the code changed after that approval.
const changedAfter = i => i.walkApproved && i.walkthrough && i.walkthrough !== i.walkApproved && !["walk", "merged"].includes(i.status);
const statusOf = i => hubLed(i) ? [T.hubGoes, "clay"] : waitsApproval(i) ? [T.waitsMerge, "bad"] : i.walkPending && i.status !== "walk" ? [T.needWalk, "bad"] : i.reviewPending && i.status !== "review" ? [T.needReview, "bad"]
  : ST[i.status] ? [T.st[i.status], ST[i.status]] : [T.st.todo, ST.todo];
const prLink = i => i.pr ? (/^https:\/\//.test(i.prUrl || "") ? `<a href="${esc(i.prUrl)}" target="_blank" rel="noopener">#${esc(i.pr)}</a>` : `#${esc(i.pr)}`) : "";
// A link the hub wrote: https, or a file inside the hub folder (specs/N1.md). Anything else is shown as plain text.
const safeRef = h => /^https:\/\/\S+$/.test(String(h || "")) || (/^[A-Za-z0-9_.\/-]+$/.test(String(h || "")) && !/^\/|\.\./.test(String(h)));
const refLink = (href, label) => safeRef(href) ? `<a href="${esc(href)}" target="_blank" rel="noopener">${esc(label)}</a>` : esc(label);
const okId = id => /^[A-Za-z0-9_-]+$/.test(String(id || ""));
let CARDS = new Set(); // ids that have a card on the page
const jump = id => okId(id) && CARDS.has(String(id)) ? `<a href="#i-${id}">${id}</a>` : esc(id); // to the item's card in 개발 흐름
const STAGES = ["todo", "active", "review", "walk", "pr", "ready", "merged"];
const mins = iso => { const t = Date.parse(iso || ""); return Number.isNaN(t) ? null : Math.max(0, Math.floor((Date.now() - t) / 60000)); };
const ago = iso => { const m = mins(iso); return m === null ? "" : m < 1 ? T.justNow : m < 60 ? T.minAgo(m) : T.hAgo(Math.floor(m / 60), m % 60); };
// Orca's agentWait (worktree ps --agent-wait) is e.g. { source: "hook", since: <ms> }; a reason, when present, is shown.
// Takes a live worker entry; without a reason it names the command the worker is stopped on.
const waitLabel = e => {
  const w = e.wait;
  const reason = typeof w === "string" ? w : w && (w.reason || w.summary);
  if (reason) return T.waitReason(reason);
  const m = w && w.since ? mins(new Date(w.since).toISOString()) : null;
  return (m === null ? T.wait : T.waitMin(m)) +(e.tool ? ` · ${String(e.tool).slice(0, 40)}` : "");
};

let S = null, L = null, stateBroken = false, liveMissing = true, lastKey = "";

// Resolves the global the file assigns, null when the file loaded but did not assign it (syntax error, half-written file), undefined when the file is missing.
function load(file, global) {
  return new Promise(resolve => {
    window[global] = undefined;
    const el = document.createElement("script");
    el.src = `${file}?t=${Date.now()}`;
    el.onload = () => { el.remove(); resolve(window[global] ?? null); };
    el.onerror = () => { el.remove(); resolve(undefined); };
    document.head.appendChild(el);
  });
}

async function tick() {
  const s = await load("state.js", "HUB_STATE");
  if (s) { S = s; stateBroken = false; } else stateBroken = true;
  const l = await load("live.js", "HUB_LIVE");
  if (l === undefined) { L = null; liveMissing = true; } else if (l) { L = l; liveMissing = false; }
  const key = JSON.stringify([S, L, stateBroken, liveMissing, Math.floor(Date.now() / 30000)]);
  if (key !== lastKey) { lastKey = key; render(); }
}

function render() {
  T = (S && L10N[S.lang]) || L10N.ko;
  document.documentElement.lang = T.lang;
  if (!S) {
    app.innerHTML = `<div class="ask">${T.noState}</div>`;
    return;
  }
  document.title = T.docTitle(S.title);
  LEVEL = ["medium", "high"].includes(S.autonomy) ? S.autonomy : "low";
  for (const k of ["lanes", "workers", "decisions", "log"]) if (!Array.isArray(S[k])) S[k] = [];
  for (const l of S.lanes) if (!Array.isArray(l.items)) l.items = [];
  const W = (L && L.workers) || {}, P = (L && L.prs) || {}, NEW = (L && L.discovered) || {};
  // What workers reported that the hub has not written into state.js yet (sync.cjs reads the Run's inbox).
  const H = (L && L.hub) || { count: 0, items: {} }, HI = H.items || {};
  const lagM = H.count && H.oldestAt ? mins(H.oldestAt) : null;
  const own = S.lanes.filter(l => l.countsAsPr);
  const prs = own.flatMap(l => l.items);
  const merged = prs.filter(i => i.status === "merged").length;
  const reviewing = prs.filter(i => i.status === "review").length;
  const approvals = prs.filter(yours);
  const walks = prs.filter(i => i.status === "walk" && !hubLed(i));
  CARDS = new Set(S.lanes.flatMap(l => l.items).map(i => String(i.id)));
  const blockedItems = prs.filter(i => i.status === "blocked");
  const blockedAll = S.lanes.flatMap(l => l.items).filter(i => i.status === "blocked"); // another owner's blocked item still needs the developer
  const list = x => Array.isArray(x) ? x : typeof x === "string" && x ? [x] : [];
  const active = S.workers.filter(w => w.tone === "active").length;
  const openDecisions = S.decisions.filter(d => d.status === "open");
  const waiting = Object.entries(W).filter(([, w]) => w && w.wait);
  const started = new Set(S.workers.map(w => w.item));
  // Everything only the developer can do, most blocking first. Each row: what it is, where to look, how to answer.
  const todo = [
    ...waiting.map(([id, w]) => ({ kind: T.kWait, text: T.waitText(jump(id), esc(waitLabel(w))), how: T.waitHow })),
    ...list(S.needs).map(n => typeof n === "string" ? { text: n } : n || {}).filter(n => n.text).map(n => ({ kind: T.kNeed, text: esc(n.text), how: esc(n.how || T.needHow) })),
    ...openDecisions.map(d => ({ kind: T.kDec, text: `${d.id ? `<b>${esc(d.id)}</b> ` : ""}${esc(d.text)}`,
      opts: list(d.options).map(o => `<span class="opt ${o === d.recommend ? "rec" : ""}">${esc(o)}${o === d.recommend ? T.recommend : ""}</span>`).join(""),
      how: `${T.decHow}${list(d.items).length ? T.decWaits(list(d.items).map(jump).join(", ")) : ""}` })),
    ...walks.map(i => ({ kind: T.kWalk, text: `${jump(i.id)} ${esc(i.title)}`, links: walkLink(i), how: T.walkHow })),
    ...approvals.map(i => ({ kind: T.kMerge, text: `${jump(i.id)} ${esc(i.title)}`, links: [prLink(i), walkLink(i)].filter(Boolean).join(" · ") + (changedAfter(i) ? ` <span class="pill watch">${T.changed}</span>` : ""), how: T.mergeHow(esc(i.id)) })),
    ...blockedAll.map(i => ({ kind: T.kBlocked, text: `${jump(i.id)} ${esc(i.title)}${i.ext ? `: ${esc(i.ext)}` : ""}`, links: prLink(i), how: T.blockedHow })),
  ];
  const todoN = todo.length || (S.ask ? 1 : 0);
  const headline = merged === prs.length && prs.length
    ? T.headAllMerged(S.title, prs.length)
    : todoN ? T.headTodo(S.title, S.owner, todoN) : T.headNone(S.title, S.owner);

  const items = Object.fromEntries(S.lanes.flatMap(l => l.items).map(i => [i.id, i]));
  const liveSignal = (w, item) => {
    if (w.wait) return `<span class="pill bad">${esc(waitLabel(w))}</span>`;
    if (item && item.waiting) return ""; // the hub marked a legitimate wait; node() shows it
    if (item && HI[item.id] && HI[item.id].last && HI[item.id].last.type !== "status") return ""; // it reported; the hub has not read it yet
    const m = mins(w.at);
    const itemStatus = item ? item.status : "";
    if (w.state !== "working" && itemStatus === "active" && m >= STOPPED_MIN) return `<span class="pill watch">${T.stopped(m)}</span>`;
    if (w.state === "working" && m >= SAME_STEP_MIN) return `<span class="pill watch">${T.sameStep(m)}</span>`;
    return "";
  };
  const nowLine = (w, item) => !w ? "" : `<div class="now">${liveSignal(w, item)}${w.say ? `<div>▸ ${esc(w.say)}</div>` : ""}<div class="age">${w.tool ? `<span class="mono">${esc(w.tool)}</span> · ` : ""}${ago(w.at)}</div></div>`;
  const ciPill = i => {
    const p = i.pr && P[i.pr];
    if (!p || i.status === "merged") return "";
    if (p.ci === "pass") return `<span class="pill good">${T.ciPass}</span>`;
    if (p.ci === "fail") return `<span class="pill bad">${T.ciFail(esc(p.fail))}</span>`;
    if (p.ci === "pending") return `<span class="pill watch">${T.ciPending(esc(p.pass), esc((p.pass || 0) + (p.fail || 0) + (p.pending || 0)))}</span>`;
    return "";
  };
  const reported = i => {
    const h = HI[i.id], bits = [];
    if (NEW[i.id] && ["todo", "blocked"].includes(i.status)) bits.push(`<span class="pill clay">${T.startedPending}</span>`);
    if (h && h.phase && PH_NUM[h.phase] > (i.phases || 0)) bits.push(`<span class="pill watch">${T.reportedPhase(esc(T.phases[PH_NUM[h.phase] - 1]))}</span>`);
    if (h && h.last && ["worker_done", "ask", "question", "escalation"].includes(h.last.type)) bits.push(`<span class="pill watch">${T.msgPending(esc(T.msg[h.last.type]))}</span>`);
    return bits.join("");
  };
  // What the PR does so far: the hub's `done`, except while a newer worker SUMMARY line waits for the hub (sync.cjs marks it fresh).
  const NOTES = H.notes || {};
  const sofar = i => { const n = i.status !== "merged" && NOTES[i.id]; return n && n.text && (n.fresh || !i.done) ? n.text : (i.done || ""); };
  const node = i => {
    const [label, tone] = statusOf(i);
    const risks = (i.risk || []).map(r => `<span class="pill watch">${esc(r)}</span>`).join("");
    const docs = [walkLink(i), started.has(i.id) && okId(i.id) ? refLink(`specs/${i.id}.md`, T.specLink) : ""].filter(Boolean).join(" · ");
    const after = (Array.isArray(i.after) ? i.after : typeof i.after === "string" && i.after ? [i.after] : []).map(jump).join(", ");
    return `<div class="node s-${hubLed(i) ? "hub" : esc(i.status)}${yours(i) ? " s-you" : ""}"${okId(i.id) ? ` id="i-${i.id}"` : ""}><div class="id">${esc(i.id)} ${prLink(i)}</div><div class="t">${esc(i.title)}</div>${sofar(i) ? `<div class="sofar">${esc(sofar(i))}</div>` : ""}<div class="pills"><span class="pill ${tone}">${label}</span>${reported(i)}${ciPill(i)}${risks}${i.waiting ? `<span class="pill watch">${T.waitingPill(esc(i.waiting))}</span>` : ""}</div>${docs ? `<div class="ext">${docs}${changedAfter(i) ? ` <span class="pill watch">${T.changed}</span>` : ""}</div>` : ""}${after ? `<div class="ext">${T.afterLine(after)}</div>` : ""}${i.status === "merged" && i.pr ? `<div class="ext">${T.mergedVia(prLink(i), i.mergeSha ? ` · <span class="mono">${esc(String(i.mergeSha).slice(0, 7))}</span>` : "")}</div>` : ""}${i.ext ? `<div class="ext">${esc(i.ext)}</div>` : ""}${i.status === "merged" ? "" : nowLine(W[i.id], NEW[i.id] && i.status === "todo" ? { ...i, status: "active" } : i)}</div>`;
  };
  const rows = own.flatMap(l => l.items.map(i => {
    const done = i.phases || 0;
    const live = ["active", "walk", "pr", "review", "ready"].includes(i.status);
    const late = k => (k === WALK && i.walkPending) || (k === REVIEW && i.reviewPending);
    const href = k => k === REVIEW ? walkHref(i, 6) : k === WALK ? walkHref(i) : k === PR && /^https:\/\//.test(i.prUrl || "") ? esc(i.prUrl) : "";
    const cells = T.phases.map((name, k) => {
      const box = `<span class="box ${late(k) ? "late" : k < done ? "on" : (k === done && live ? "now" : "")}">${k < done && !late(k) ? check : ""}</span>`;
      return `<td>${href(k) ? `<a href="${href(k)}" target="_blank" rel="noopener" title="${name}: ${k === PR ? T.openPr : T.walkLink}">${box}</a>` : box}</td>`;
    }).join("");
    return `<tr><td class="l"><b>${esc(i.id)}</b> ${prLink(i)} ${esc(i.title)}</td><td class="l">${esc(l.name)}</td>${cells}</tr>`;
  })).join("");
  // Where every PR is, left to right. A stage the developer must act on is red; each id jumps to its card.
  const stageOf = i => i.status === "todo" && NEW[i.id] ? "active" : STAGES.includes(i.status) ? i.status : "todo"; // a worker that already started counts as working
  const stages = STAGES.map(k => {
    const here = prs.filter(i => i.status !== "blocked" && stageOf(i) === k);
    const you = (k === "walk" && here.some(i => !hubLed(i))) || (k === "ready" && here.some(yours));
    return `<div class="stage ${!here.length ? "zero" : you ? "you" : k === "merged" ? "done" : ""}"><div class="n">${here.length}</div><div class="lbl">${T.stage[k]}</div><div class="ids">${here.map(i => jump(i.id)).join("")}</div></div>`;
  }).join("") + (blockedItems.length ? `<div class="stage you"><div class="n">${blockedItems.length}</div><div class="lbl">${T.st.blocked}</div><div class="ids">${blockedItems.map(i => jump(i.id)).join("")}</div></div>` : "");
  const know = list(S.summary).slice(0, 3);
  const decLi = d => { const st = DEC[d.status] ? d.status : "watching"; return `<li><span class="pill ${DEC[st]}">${T.dec[st]}</span> ${d.id ? `<b>${esc(d.id)}</b> ` : ""}${esc(d.text)}${d.answer ? ` → <b>${esc(d.answer)}</b>` : ""}</li>`; };
  const hubDec = S.decisions.filter(d => d.by === "hub" && d.status === "answered");
  const rest = S.decisions.filter(d => d.status !== "open" && !hubDec.includes(d));
  // Beside the hub's list, the developer's heading holds only what they answered; other rows (watching) follow without a heading.
  const mine = rest.filter(d => d.status === "answered"), other = rest.filter(d => d.status !== "answered");
  const decSplit = `${mine.length ? `<h3>${T.yourDecH(esc(S.owner))}</h3><ul class="items">${mine.map(decLi).join("")}</ul>` : ""}${other.length ? `<ul class="items">${other.map(decLi).join("")}</ul>` : ""}`;
  const hubLine = LEVEL === "high" && hubDec.length ? `<li><a href="#decided">${T.hubDecLine(hubDec.length)}</a></li>` : "";
  const hubList = hubDec.length ? `<h3>${T.hubDecH}</h3><ul class="items">${hubDec.map(d => `<li>${d.id ? `<b>${esc(d.id)}</b> ` : ""}${esc(d.text)} → <b>${esc(d.answer)}</b></li>`).join("")}</ul>` : "";
  const refs = [refLink("spec.md", T.specDoc), refLink("protocol.md", T.protocolDoc), ...(Array.isArray(S.refs) ? S.refs : []).filter(r => r && r.label).slice(0, 6).map(r => refLink(r.href, r.label))];
  const syncM = L ? mins(L.at) : null;
  const sync = S.closed ? `<span class="pill idle">${T.syncDone}</span>`
    : liveMissing ? `<span class="pill idle">${T.syncOff}</span>`
    : syncM >= SYNC_STALE_MIN ? `<span class="pill bad">${T.syncStale(syncM)}</span>`
    : `<span class="pill good">${T.syncLive(ago(L.at))}</span>`;
  const syncErr = L && L.errors && L.errors.length ? ` <span class="pill watch">${T.syncErr(esc(L.errors[0]))}</span>` : "";
  const allMerged = merged === prs.length && prs.length;
  // Overall progress: a merged PR counts all 8 checkpoints; floor, so 100 only when every PR is merged.
  const reached = prs.reduce((n, i) => n + (i.status === "merged" ? 8 : Math.min(Math.max(Number(i.phases) || 0, 0), 8)), 0);
  const share = prs.length ? reached * 100 / (8 * prs.length) : 0, pct = Math.floor(share), mergedW = merged * 100 / (prs.length || 1);
  // The all-merged headline already states the count, so the bar then shows the percentage alone (the count stays in its title).
  const prog = !prs.length ? "" : `<div class="prog" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100" aria-label="${T.progLabel}" title="${T.progMerged(merged, prs.length)}"><div class="prog-track"><span class="prog-done" style="width:${mergedW.toFixed(2)}%"></span><span class="prog-move" style="width:${Math.max(share - mergedW, 0).toFixed(2)}%"></span></div><span class="prog-text"><b>${pct}%</b>${allMerged ? "" : ` · ${T.progMerged(merged, prs.length)}`}</span></div>`;
  const asks = todoN
    ? `<div class="ask"><b>${T.askHead(esc(S.owner))}</b>${S.ask ? `<div>${esc(S.ask)}</div>` : ""}${todo.length ? `<ol class="todo">${todo.map(t => `<li><span class="pill bad">${t.kind}</span> ${t.text}${t.links ? ` · ${t.links}` : ""}${t.opts ? `<div class="opts">${t.opts}</div>` : ""}<div class="how">${t.how}</div></li>`).join("")}</ol>` : ""}</div>`
    : allMerged || S.closed ? "" : `<div class="ask calm"><b>${T.calm(esc(S.owner))}</b></div>`;

  app.innerHTML = `${prog}
${H.count && lagM >= HUB_LAG_MIN && !S.closed ? `<div class="ask ${lagM >= 15 ? "warnbar" : ""}">${T.hubLag(esc(H.count), H.more, ago(H.oldestAt))}</div>` : ""}
${stateBroken ? `<div class="ask warnbar">${T.stateBroken}</div>` : ""}
<div class="meta"><span>${T.meta(esc(S.title), esc(S.owner), esc(S.baseSha))}${LEVEL === "low" ? "" : ` · <span title="${esc(T.levelTip[LEVEL])}">${T.level[LEVEL]}</span>`}</span><span>${T.updated(esc(S.updatedAt))} · ${sync}${syncErr}</span></div>
<h1>${esc(headline)}</h1>
${asks}
<div class="stages">${stages}</div>
${know.length || hubLine ? `<ul class="know">${know.map(x => `<li>${esc(x)}</li>`).join("")}${hubLine}</ul>` : ""}
<div class="refs"><span>${T.refsLabel}</span>${refs.join("")}</div>
<section class="card">
  <h2>${T.flowH}${S.flowSummary ? `: ${esc(S.flowSummary)}` : ""}</h2>
  ${S.lanes.map(l => `<div class="lane"><div class="lane-h">${esc(l.name)}</div><div class="flow">${l.items.map(node).join(arrow)}</div></div>`).join("")}
  <div class="legend">${["good", "clay", "watch", "idle", "bad"].map((tone, k) => `<span class="pill ${tone}">${T.legend[k]}</span>`).join("")}</div>
</section>
<section class="card">
  <h2>${T.checkH}</h2>
  <div class="tablewrap"><table>
    <thead><tr><th class="l">${T.thPr}</th><th class="l">${T.thLane}</th>${T.phases.map(p => `<th>${p}</th>`).join("")}</tr></thead>
    <tbody>${rows}</tbody>
  </table></div>
</section>
<section class="grid2">
  <div class="card"${hubDec.length ? ' id="decided"' : ""}><h2>${T.decidedH}</h2>${hubList}${hubDec.length ? decSplit : `<ul class="items">${rest.map(decLi).join("") || `<li>${T.decidedNone}</li>`}</ul>`}</div>
  <div class="card"><h2>${T.workersH(active, esc(S.workerCap))}</h2><ul class="items">${Object.entries(NEW).map(([id, d]) => `<li><span class="pill clay">${T.startedNew}</span> <b>${esc(id)}</b> · <span class="mono">${esc(String(d.path || "").split("/").pop())}</span>${nowLine(W[id], { status: "active" })}</li>`).join("")}${S.workers.map(w => `<li><span class="pill ${TONE[w.tone] || "idle"}">${esc(w.state)}</span> <b>${esc(w.lane)} ${esc(w.item)}</b> · <span class="mono">${esc(w.worktree)}</span>${w.tone === "done" ? "" : nowLine(W[w.item], items[w.item])}</li>`).join("")}${S.log.slice(0, 8).map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>
</section>`;
}

tick();
setInterval(tick, POLL_MS);
</script>
</body>
</html>
