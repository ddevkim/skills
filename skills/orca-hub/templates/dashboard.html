<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>허브 진행 현황</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<!-- Non-blocking: a slow or offline font server must not hold the renderer script. -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root {
  --bg: #fff; --soft: #f9f9f9; --card: #fff;
  --text: rgba(0,0,0,.9); --text-2: rgba(0,0,0,.6); --text-3: rgba(0,0,0,.47);
  --line: rgba(0,0,0,.12); --shadow: 0 4px 20px rgba(0,0,0,.075);
  --clay: #d97757; --clay-strong: #c6613f; --clay-bg: rgba(217,119,87,.12);
  --good: #006c10; --good-bg: rgba(16,161,34,.14);
  --bad: #a42528; --bad-bg: rgba(220,60,61,.12);
  --watch: #794c02; --watch-bg: rgba(251,179,21,.16);
  --idle-bg: rgba(0,0,0,.05);
  --serif: "Noto Serif KR", Georgia, "Times New Roman", serif;
  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #151515; --soft: #0b0b0b; --card: #1f1f1f;
  --text: rgba(255,255,255,.93); --text-2: rgba(255,255,255,.57); --text-3: rgba(255,255,255,.4);
  --line: rgba(255,255,255,.12); --shadow: none; --idle-bg: rgba(255,255,255,.06);
  --good: #53c556; --bad: #f17778; --watch: #e49c06; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #151515; --soft: #0b0b0b; --card: #1f1f1f;
  --text: rgba(255,255,255,.93); --text-2: rgba(255,255,255,.57); --text-3: rgba(255,255,255,.4);
  --line: rgba(255,255,255,.12); --shadow: none; --idle-bg: rgba(255,255,255,.06);
  --good: #53c556; --bad: #f17778; --watch: #e49c06; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.55 var(--sans); word-break: keep-all; overflow-wrap: anywhere; }
main { max-width: 1180px; margin: 0 auto; padding: 0 16px 48px; }
h1, h2 { font-family: var(--serif); font-weight: 400; margin: 0; text-wrap: balance; }
h1 { font-size: 32px; line-height: 1.25; margin-top: 20px; }
h2 { font-size: 22px; line-height: 1.3; margin-bottom: 14px; }
.meta { font-size: 13px; color: var(--text-2); border-bottom: 1px solid var(--line); padding: 12px 0; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 20px; }
.num { font-size: 40px; font-weight: 500; line-height: 1; white-space: nowrap; }
.pill { display: inline-block; border-radius: 999px; padding: 2px 10px; font-size: 13px; font-weight: 500; white-space: nowrap; }
.good { color: var(--good); background: var(--good-bg); } .bad { color: var(--bad); background: var(--bad-bg); } .watch { color: var(--watch); background: var(--watch-bg); }
.clay { color: var(--clay-strong); background: var(--clay-bg); } .idle { color: var(--text-2); background: var(--idle-bg); }
section { margin-top: 28px; }
.ask { margin-top: 14px; padding: 14px 18px; border-left: 4px solid var(--clay); background: var(--clay-bg); border-radius: 10px; font-size: 16px; }
.ask b { color: var(--clay-strong); }
.ask.calm { border-left-color: var(--good); background: var(--good-bg); }
/* the developer's to-do list: one row per thing only they can do */
ol.todo { list-style: none; padding: 0; margin: 10px 0 0; counter-reset: todo; }
ol.todo li { counter-increment: todo; padding: 10px 0 10px 34px; border-top: 1px solid var(--line); position: relative; font-size: 15px; }
ol.todo li::before { content: counter(todo); position: absolute; left: 0; top: 10px; width: 24px; height: 24px; border-radius: 999px; background: var(--clay-strong); color: #fff; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center; }
ol.todo .how { font-size: 13px; color: var(--text-2); margin-top: 4px; }
ol.todo .opts { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 6px; }
.opt { border: 1px solid var(--line); border-radius: 8px; padding: 2px 8px; font-size: 13px; background: var(--card); }
.opt.rec { border-color: var(--clay); }
.refs { margin-top: 12px; font-size: 13px; color: var(--text-2); display: flex; flex-wrap: wrap; gap: 4px 14px; }
/* stage strip: where every PR is, left to right */
.stages { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 18px; }
.stage { flex: 1 1 110px; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--card); }
.stage .n { font-size: 28px; font-weight: 500; line-height: 1.1; }
.stage .lbl { font-size: 13px; color: var(--text-2); }
.stage .ids { font-size: 13px; margin-top: 4px; min-height: 18px; display: flex; flex-wrap: wrap; gap: 2px 8px; }
.stage.zero { background: var(--soft); } .stage.zero .n { color: var(--text-3); }
.stage.you { border-color: var(--bad); background: var(--bad-bg); } .stage.you .n { color: var(--bad); }
.stage.done { border-color: var(--good); } .stage.done .n { color: var(--good); }
.node:target { outline: 3px solid var(--clay); outline-offset: 2px; }
ul.know { margin: 14px 0 0; padding: 0 0 0 20px; font-size: 15px; } ul.know li { margin: 4px 0; }
/* flow */
.lane { margin-bottom: 18px; }
.lane-h { font-size: 13px; color: var(--text-2); margin-bottom: 8px; font-weight: 600; }
.flow { display: flex; flex-wrap: wrap; align-items: stretch; gap: 8px; }
.node { min-width: 180px; flex: 1 1 180px; max-width: 260px; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--card); }
.node.s-merged { border-color: var(--good); }
.node.s-active, .node.s-pr { border-color: var(--clay); box-shadow: 0 0 0 2px var(--clay-bg); }
.node.s-review { border-color: var(--watch); box-shadow: 0 0 0 2px var(--watch-bg); }
.node.s-ready { border-color: var(--good); box-shadow: 0 0 0 2px var(--good-bg); }
.node.s-walk, .node.s-you { border-color: var(--bad); box-shadow: 0 0 0 2px var(--bad-bg); }
.node.s-blocked { border-color: var(--bad); }
.node .pills { display: flex; flex-wrap: wrap; gap: 4px; }
.now { margin-top: 8px; font-size: 13px; line-height: 1.4; color: var(--text-2); }
.now .pill { margin-bottom: 4px; }
.node .pill, ol.todo .pill, .items .pill { white-space: normal; } /* a long label wraps inside its card */
.now .age { color: var(--text-3); font-size: 12px; margin-top: 2px; }
.warnbar { border-left-color: var(--bad); background: var(--bad-bg); }
.node .id { font-size: 13px; color: var(--text-3); font-weight: 600; }
.node .t { font-size: 14px; line-height: 1.35; margin: 4px 0 8px; }
.node .sofar { font-size: 13px; line-height: 1.45; margin: 0 0 8px; padding-left: 8px; border-left: 2px solid var(--line); }
.node .ext { font-size: 13px; color: var(--text-3); margin-top: 6px; }
.arrow { align-self: center; color: var(--text-3); flex: 0 0 auto; }
.legend { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
/* checklist */
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 720px; font-size: 14px; }
th, td { border-bottom: 1px solid var(--line); padding: 10px 8px; text-align: center; }
th { font-size: 13px; color: var(--text-2); font-weight: 600; }
td.l, th.l { text-align: left; }
.box { display: inline-flex; width: 20px; height: 20px; border-radius: 5px; border: 1.5px solid var(--line); align-items: center; justify-content: center; vertical-align: middle; }
.box.on { background: var(--good); border-color: var(--good); }
.box.now { border-color: var(--clay); background: var(--clay-bg); }
.box.late { border-color: var(--bad); border-style: dashed; }
.box svg { width: 14px; height: 14px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 12px; }
ul.items { list-style: none; padding: 0; margin: 0; }
ul.items li { padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
ul.items li:last-child { border-bottom: 0; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
a { color: var(--clay-strong); }
</style>
</head>
<body>
<main id="app"></main>
<script>
/* Fixed renderer. Never edit this file: the hub edits state.js, sync.cjs writes live.js.
   Both are re-read every few seconds with <script> tags, because fetch() of local files is blocked on file://. */
const POLL_MS = 5000, SYNC_STALE_MIN = 2, STOPPED_MIN = 5, SAME_STEP_MIN = 30;
const PH_KO = ["시험 실패 확인", "구현 통과", "전체 검증", "독립 리뷰 통과", "워크스루 승인", "PR 열림", "CI 통과", "병합"];
const REVIEW = 3, WALK = 4, PR = 5; // PH_KO indexes that link somewhere
const ST = { todo: ["대기", "idle"], active: ["작업 중", "clay"], walk: ["워크스루 대기", "bad"], pr: ["PR 열림·CI", "clay"], review: ["리뷰 중", "watch"],
  ready: ["병합 준비됨", "good"], merged: ["병합됨", "good"], blocked: ["막힘", "bad"] };
const PH_NUM = { red: 1, green: 2, verified: 3, "pr-open": 6, "ci-green": 7 }; // status --phase → phases (sync.cjs)
const MSG_KO = { worker_done: "작업자 완료 보고", ask: "작업자 질문", question: "작업자 질문", escalation: "작업자 멈춤 알림" };
const HUB_LAG_MIN = 3; // older unhandled worker messages than this: the hub is behind
const DEC = { open: ["결정 필요", "bad"], watching: ["확인 중", "watch"], answered: ["답함", "good"] };
const TONE = { active: "clay", support: "watch", done: "good" };
const check = '<svg viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.5l3 3 6-7"/></svg>';
const arrow = '<svg class="arrow" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 9h11M10 5l4 4-4 4"/></svg>';
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const app = document.getElementById("app");
const onMain = i => i.base === "main";
const waitsApproval = i => i.status === "ready" && onMain(i) && !i.walkPending && !i.reviewPending;
const walkHref = (i, step = 1) => /^[A-Za-z0-9_-]+-w\d+$/.test(String(i.walkthrough || "")) ? `walkthrough.html?w=${i.walkthrough}#${step}` : "";
const walkLink = i => walkHref(i) ? `<a href="${walkHref(i)}" target="_blank" rel="noopener">워크스루 보기</a>` : "";
// The developer approved round walkApproved; a later round means the code changed after that approval.
const changedAfter = i => i.walkApproved && i.walkthrough && i.walkthrough !== i.walkApproved && !["walk", "merged"].includes(i.status);
const statusOf = i => waitsApproval(i) ? ["병합 승인 대기", "bad"] : i.walkPending && i.status !== "walk" ? ["워크스루 필요", "bad"] : i.reviewPending && i.status !== "review" ? ["독립 리뷰 필요", "bad"] : (ST[i.status] || ST.todo);
const prLink = i => i.pr ? (/^https:\/\//.test(i.prUrl || "") ? `<a href="${esc(i.prUrl)}" target="_blank" rel="noopener">#${esc(i.pr)}</a>` : `#${esc(i.pr)}`) : "";
// A link the hub wrote: https, or a file inside the hub folder (specs/N1.md). Anything else is shown as plain text.
const safeRef = h => /^https:\/\/\S+$/.test(String(h || "")) || (/^[A-Za-z0-9_.\/-]+$/.test(String(h || "")) && !/^\/|\.\./.test(String(h)));
const refLink = (href, label) => safeRef(href) ? `<a href="${esc(href)}" target="_blank" rel="noopener">${esc(label)}</a>` : esc(label);
const okId = id => /^[A-Za-z0-9_-]+$/.test(String(id || ""));
let CARDS = new Set(); // ids that have a card on the page
const jump = id => okId(id) && CARDS.has(String(id)) ? `<a href="#i-${id}">${id}</a>` : esc(id); // to the item's card in 개발 흐름
const STAGES = [["todo", "대기"], ["active", "작업 중"], ["review", "독립 리뷰"], ["walk", "워크스루 대기"], ["pr", "PR 열림·CI"], ["ready", "병합 준비됨"], ["merged", "병합됨"]];
const mins = iso => { const t = Date.parse(iso || ""); return Number.isNaN(t) ? null : Math.max(0, Math.floor((Date.now() - t) / 60000)); };
const ago = iso => { const m = mins(iso); return m === null ? "" : m < 1 ? "방금" : m < 60 ? `${m}분 전` : `${Math.floor(m / 60)}시간 ${m % 60}분 전`; };
// Orca's agentWait (worktree ps --agent-wait) is e.g. { source: "hook", since: <ms> }; a reason, when present, is shown.
// Takes a live worker entry; without a reason it names the command the worker is stopped on.
const waitLabel = e => {
  const w = e.wait;
  const reason = typeof w === "string" ? w : w && (w.reason || w.summary);
  if (reason) return `입력 대기: ${reason}`;
  const m = w && w.since ? mins(new Date(w.since).toISOString()) : null;
  return (m === null ? "입력 대기" : `입력 대기 ${m}분`) + (e.tool ? ` · ${String(e.tool).slice(0, 40)}` : "");
};

let S = null, L = null, stateBroken = false, liveMissing = true, lastKey = "";

// Resolves the global the file assigns, null when the file loaded but did not assign it (syntax error, half-written file), undefined when the file is missing.
function load(file, global) {
  return new Promise(resolve => {
    window[global] = undefined;
    const el = document.createElement("script");
    el.src = `${file}?t=${Date.now()}`;
    el.onload = () => { el.remove(); resolve(window[global] ?? null); };
    el.onerror = () => { el.remove(); resolve(undefined); };
    document.head.appendChild(el);
  });
}

async function tick() {
  const s = await load("state.js", "HUB_STATE");
  if (s) { S = s; stateBroken = false; } else stateBroken = true;
  const l = await load("live.js", "HUB_LIVE");
  if (l === undefined) { L = null; liveMissing = true; } else if (l) { L = l; liveMissing = false; }
  const key = JSON.stringify([S, L, stateBroken, liveMissing, Math.floor(Date.now() / 30000)]);
  if (key !== lastKey) { lastKey = key; render(); }
}

function render() {
  if (!S) {
    app.innerHTML = '<div class="ask">state.js 를 읽지 못했습니다. 같은 폴더에 state.js 가 있는지, 문법 오류가 없는지 확인하세요.</div>';
    return;
  }
  document.title = `${S.title} 진행`;
  for (const k of ["lanes", "workers", "decisions", "log"]) if (!Array.isArray(S[k])) S[k] = [];
  for (const l of S.lanes) if (!Array.isArray(l.items)) l.items = [];
  const W = (L && L.workers) || {}, P = (L && L.prs) || {}, NEW = (L && L.discovered) || {};
  // What workers reported that the hub has not written into state.js yet (sync.cjs reads the Run's inbox).
  const H = (L && L.hub) || { count: 0, items: {} }, HI = H.items || {};
  const lagM = H.count && H.oldestAt ? mins(H.oldestAt) : null;
  const own = S.lanes.filter(l => l.countsAsPr);
  const prs = own.flatMap(l => l.items);
  const merged = prs.filter(i => i.status === "merged").length;
  const reviewing = prs.filter(i => i.status === "review").length;
  const approvals = prs.filter(waitsApproval);
  const walks = prs.filter(i => i.status === "walk");
  CARDS = new Set(S.lanes.flatMap(l => l.items).map(i => String(i.id)));
  const blockedItems = prs.filter(i => i.status === "blocked");
  const blockedAll = S.lanes.flatMap(l => l.items).filter(i => i.status === "blocked"); // another owner's blocked item still needs the developer
  const list = x => Array.isArray(x) ? x : typeof x === "string" && x ? [x] : [];
  const active = S.workers.filter(w => w.tone === "active").length;
  const openDecisions = S.decisions.filter(d => d.status === "open");
  const waiting = Object.entries(W).filter(([, w]) => w && w.wait);
  const started = new Set(S.workers.map(w => w.item));
  // Everything only the developer can do, most blocking first. Each row: what it is, where to look, how to answer.
  const todo = [
    ...waiting.map(([id, w]) => ({ kind: "입력 대기", text: `작업자 ${jump(id)} 가 터미널에서 답을 기다립니다 (${esc(waitLabel(w))}).`, how: "Orca 사이드바에서 그 작업자를 열어 답합니다." })),
    ...list(S.needs).map(n => typeof n === "string" ? { text: n } : n || {}).filter(n => n.text).map(n => ({ kind: "직접 할 일", text: esc(n.text), how: esc(n.how || "끝나면 허브 대화에 알려 줍니다.") })),
    ...openDecisions.map(d => ({ kind: "결정", text: `${d.id ? `<b>${esc(d.id)}</b> ` : ""}${esc(d.text)}`,
      opts: list(d.options).map(o => `<span class="opt ${o === d.recommend ? "rec" : ""}">${esc(o)}${o === d.recommend ? " · 허브 권장" : ""}</span>`).join(""),
      how: `허브 대화에서 답합니다.${list(d.items).length ? ` 이 답을 기다리는 작업: ${list(d.items).map(jump).join(", ")}` : ""}` })),
    ...walks.map(i => ({ kind: "워크스루 승인", text: `${jump(i.id)} ${esc(i.title)}`, links: walkLink(i), how: "워크스루를 읽고 허브 대화에서 승인하거나 질문합니다. 승인해야 PR 이 열립니다." })),
    ...approvals.map(i => ({ kind: "병합 승인", text: `${jump(i.id)} ${esc(i.title)}`, links: [prLink(i), walkLink(i)].filter(Boolean).join(" · ") + (changedAfter(i) ? ` <span class="pill watch">승인 뒤 변경</span>` : ""), how: `허브 대화에 "${esc(i.id)} 병합해" 라고 답합니다.` })),
    ...blockedAll.map(i => ({ kind: "막힘", text: `${jump(i.id)} ${esc(i.title)}${i.ext ? `: ${esc(i.ext)}` : ""}`, links: prLink(i), how: "허브 대화에서 어떻게 풀지 정합니다." })),
  ];
  const todoN = todo.length || (S.ask ? 1 : 0);
  const headline = merged === prs.length && prs.length
    ? `${S.title}: PR ${prs.length}개를 모두 병합했다`
    : `${S.title}: ${todoN ? `${S.owner}님이 할 일이 ${todoN}건 있다` : `지금 ${S.owner}님이 할 일은 없다`}`;

  const items = Object.fromEntries(S.lanes.flatMap(l => l.items).map(i => [i.id, i]));
  const liveSignal = (w, item) => {
    if (w.wait) return `<span class="pill bad">${esc(waitLabel(w))}</span>`;
    if (item && item.waiting) return ""; // the hub marked a legitimate wait; node() shows it
    if (item && HI[item.id] && HI[item.id].last && HI[item.id].last.type !== "status") return ""; // it reported; the hub has not read it yet
    const m = mins(w.at);
    const itemStatus = item ? item.status : "";
    if (w.state !== "working" && itemStatus === "active" && m >= STOPPED_MIN) return `<span class="pill watch">작업자 멈춤 ${m}분</span>`;
    if (w.state === "working" && m >= SAME_STEP_MIN) return `<span class="pill watch">같은 단계 ${m}분째</span>`;
    return "";
  };
  const nowLine = (w, item) => !w ? "" : `<div class="now">${liveSignal(w, item)}${w.say ? `<div>▸ ${esc(w.say)}</div>` : ""}<div class="age">${w.tool ? `<span class="mono">${esc(w.tool)}</span> · ` : ""}${ago(w.at)}</div></div>`;
  const ciPill = i => {
    const p = i.pr && P[i.pr];
    if (!p || i.status === "merged") return "";
    if (p.ci === "pass") return `<span class="pill good">CI 통과</span>`;
    if (p.ci === "fail") return `<span class="pill bad">CI 실패 ${esc(p.fail)}건</span>`;
    if (p.ci === "pending") return `<span class="pill watch">CI 진행 중 ${esc(p.pass)}/${esc((p.pass || 0) + (p.fail || 0) + (p.pending || 0))}</span>`;
    return "";
  };
  const reported = i => {
    const h = HI[i.id], bits = [];
    if (NEW[i.id] && ["todo", "blocked"].includes(i.status)) bits.push(`<span class="pill clay">작업자 시작됨 · 허브 반영 전</span>`);
    if (h && h.phase && PH_NUM[h.phase] > (i.phases || 0)) bits.push(`<span class="pill watch">작업자 보고: ${esc(PH_KO[PH_NUM[h.phase] - 1])} · 허브 반영 전</span>`);
    if (h && h.last && ["worker_done", "ask", "question", "escalation"].includes(h.last.type)) bits.push(`<span class="pill watch">${esc(MSG_KO[h.last.type])} · 허브 반영 전</span>`);
    return bits.join("");
  };
  // What the PR does so far: the hub's `done`, except while a newer worker SUMMARY line waits for the hub (sync.cjs marks it fresh).
  const NOTES = H.notes || {};
  const sofar = i => { const n = i.status !== "merged" && NOTES[i.id]; return n && n.text && (n.fresh || !i.done) ? n.text : (i.done || ""); };
  const node = i => {
    const [label, tone] = statusOf(i);
    const risks = (i.risk || []).map(r => `<span class="pill watch">${esc(r)}</span>`).join("");
    const docs = [walkLink(i), started.has(i.id) && okId(i.id) ? refLink(`specs/${i.id}.md`, "작업 명세") : ""].filter(Boolean).join(" · ");
    const after = (Array.isArray(i.after) ? i.after : typeof i.after === "string" && i.after ? [i.after] : []).map(jump).join(", ");
    return `<div class="node s-${esc(i.status)}${waitsApproval(i) ? " s-you" : ""}"${okId(i.id) ? ` id="i-${i.id}"` : ""}><div class="id">${esc(i.id)} ${prLink(i)}</div><div class="t">${esc(i.title)}</div>${sofar(i) ? `<div class="sofar">${esc(sofar(i))}</div>` : ""}<div class="pills"><span class="pill ${tone}">${label}</span>${reported(i)}${ciPill(i)}${risks}${i.waiting ? `<span class="pill watch">기다림: ${esc(i.waiting)}</span>` : ""}</div>${docs ? `<div class="ext">${docs}${changedAfter(i) ? ` <span class="pill watch">승인 뒤 변경</span>` : ""}</div>` : ""}${after ? `<div class="ext">먼저 끝나야 하는 작업: ${after}</div>` : ""}${i.status === "merged" && i.pr ? `<div class="ext">PR ${prLink(i)} 로 병합했습니다${i.mergeSha ? ` · <span class="mono">${esc(String(i.mergeSha).slice(0, 7))}</span>` : ""}</div>` : ""}${i.ext ? `<div class="ext">${esc(i.ext)}</div>` : ""}${i.status === "merged" ? "" : nowLine(W[i.id], NEW[i.id] && i.status === "todo" ? { ...i, status: "active" } : i)}</div>`;
  };
  const rows = own.flatMap(l => l.items.map(i => {
    const done = i.phases || 0;
    const live = ["active", "walk", "pr", "review", "ready"].includes(i.status);
    const late = k => (k === WALK && i.walkPending) || (k === REVIEW && i.reviewPending);
    const href = k => k === REVIEW ? walkHref(i, 6) : k === WALK ? walkHref(i) : k === PR && /^https:\/\//.test(i.prUrl || "") ? esc(i.prUrl) : "";
    const cells = PH_KO.map((name, k) => {
      const box = `<span class="box ${late(k) ? "late" : k < done ? "on" : (k === done && live ? "now" : "")}">${k < done && !late(k) ? check : ""}</span>`;
      return `<td>${href(k) ? `<a href="${href(k)}" target="_blank" rel="noopener" title="${name}: ${k === PR ? "PR 열기" : "워크스루 보기"}">${box}</a>` : box}</td>`;
    }).join("");
    return `<tr><td class="l"><b>${esc(i.id)}</b> ${prLink(i)} ${esc(i.title)}</td><td class="l">${esc(l.name)}</td>${cells}</tr>`;
  })).join("");
  // Where every PR is, left to right. A stage the developer must act on is red; each id jumps to its card.
  const stageOf = i => i.status === "todo" && NEW[i.id] ? "active" : STAGES.some(([k]) => k === i.status) ? i.status : "todo"; // a worker that already started counts as working
  const stages = STAGES.map(([k, lbl]) => {
    const here = prs.filter(i => i.status !== "blocked" && stageOf(i) === k);
    const you = (k === "walk" && here.length) || (k === "ready" && here.some(waitsApproval));
    return `<div class="stage ${!here.length ? "zero" : you ? "you" : k === "merged" ? "done" : ""}"><div class="n">${here.length}</div><div class="lbl">${lbl}</div><div class="ids">${here.map(i => jump(i.id)).join("")}</div></div>`;
  }).join("") + (blockedItems.length ? `<div class="stage you"><div class="n">${blockedItems.length}</div><div class="lbl">막힘</div><div class="ids">${blockedItems.map(i => jump(i.id)).join("")}</div></div>` : "");
  const know = list(S.summary).slice(0, 3);
  const refs = [refLink("spec.md", "기능 명세"), refLink("protocol.md", "작업자 규약"), ...(Array.isArray(S.refs) ? S.refs : []).filter(r => r && r.label).slice(0, 6).map(r => refLink(r.href, r.label))];
  const syncM = L ? mins(L.at) : null;
  const sync = S.closed ? `<span class="pill idle">동기화 종료(완료)</span>`
    : liveMissing ? `<span class="pill idle">실시간 동기화 꺼짐</span>`
    : syncM >= SYNC_STALE_MIN ? `<span class="pill bad">실시간 동기화가 ${syncM}분째 멈췄습니다</span>`
    : `<span class="pill good">실시간 · ${ago(L.at)}</span>`;
  const syncErr = L && L.errors && L.errors.length ? ` <span class="pill watch">동기화 오류: ${esc(L.errors[0])}</span>` : "";
  const allMerged = merged === prs.length && prs.length;
  const asks = todoN
    ? `<div class="ask"><b>${esc(S.owner)}님이 지금 할 일</b>${S.ask ? `<div>${esc(S.ask)}</div>` : ""}${todo.length ? `<ol class="todo">${todo.map(t => `<li><span class="pill bad">${t.kind}</span> ${t.text}${t.links ? ` · ${t.links}` : ""}${t.opts ? `<div class="opts">${t.opts}</div>` : ""}<div class="how">${t.how}</div></li>`).join("")}</ol>` : ""}</div>`
    : allMerged || S.closed ? "" : `<div class="ask calm"><b>지금 ${esc(S.owner)}님이 할 일은 없습니다.</b></div>`;

  app.innerHTML = `
${H.count && lagM >= HUB_LAG_MIN && !S.closed ? `<div class="ask ${lagM >= 15 ? "warnbar" : ""}">허브가 아직 반영하지 않은 작업자 메시지가 ${esc(H.count)}건${H.more ? " 이상" : ""} 있습니다(가장 오래된 것 ${ago(H.oldestAt)}). 카드의 "허브 반영 전" 표시가 작업자가 보고한 실제 단계입니다. 허브가 대화로 질문 중이거나 다른 일을 처리하는 중일 수 있습니다.</div>` : ""}
${stateBroken ? '<div class="ask warnbar">state.js 를 읽지 못해 직전 화면을 유지합니다. 허브가 파일을 고치는 중일 수 있습니다.</div>' : ""}
<div class="meta"><span>${esc(S.title)} 진행 현황 · 허브 → ${esc(S.owner)} · 기준 <span class="mono">${esc(S.baseSha)}</span></span><span>허브 갱신 ${esc(S.updatedAt)} · ${sync}${syncErr}</span></div>
<h1>${esc(headline)}</h1>
${asks}
<div class="stages">${stages}</div>
${know.length ? `<ul class="know">${know.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
<div class="refs"><span>이 작업이 따르는 문서:</span>${refs.join("")}</div>
<section class="card">
  <h2>개발 흐름${S.flowSummary ? `: ${esc(S.flowSummary)}` : ""}</h2>
  ${S.lanes.map(l => `<div class="lane"><div class="lane-h">${esc(l.name)}</div><div class="flow">${l.items.map(node).join(arrow)}</div></div>`).join("")}
  <div class="legend"><span class="pill good">병합됨·병합 준비됨</span><span class="pill clay">작업 중·PR 열림</span><span class="pill watch">리뷰 중·위험 표시·승인 뒤 변경</span><span class="pill idle">대기</span><span class="pill bad">막힘·승인 대기·입력 대기</span></div>
</section>
<section class="card">
  <h2>PR별 체크포인트: 칸을 누르면 워크스루나 PR 이 열립니다</h2>
  <div class="tablewrap"><table>
    <thead><tr><th class="l">PR</th><th class="l">레인</th>${PH_KO.map(p => `<th>${p}</th>`).join("")}</tr></thead>
    <tbody>${rows}</tbody>
  </table></div>
</section>
<section class="grid2">
  <div class="card"><h2>지금까지 정한 것</h2><ul class="items">${S.decisions.filter(d => d.status !== "open").map(d => { const [lbl, tone] = DEC[d.status] || DEC.watching; return `<li><span class="pill ${tone}">${lbl}</span> ${d.id ? `<b>${esc(d.id)}</b> ` : ""}${esc(d.text)}${d.answer ? ` → <b>${esc(d.answer)}</b>` : ""}</li>`; }).join("") || "<li>아직 정한 것이 없다</li>"}</ul></div>
  <div class="card"><h2>작업자 ${active}명 작업 중 (동시 상한 ${esc(S.workerCap)}명)</h2><ul class="items">${Object.entries(NEW).map(([id, d]) => `<li><span class="pill clay">시작됨 · 허브 반영 전</span> <b>${esc(id)}</b> · <span class="mono">${esc(String(d.path || "").split("/").pop())}</span>${nowLine(W[id], { status: "active" })}</li>`).join("")}${S.workers.map(w => `<li><span class="pill ${TONE[w.tone] || "idle"}">${esc(w.state)}</span> <b>${esc(w.lane)} ${esc(w.item)}</b> · <span class="mono">${esc(w.worktree)}</span>${w.tone === "done" ? "" : nowLine(W[w.item], items[w.item])}</li>`).join("")}${S.log.slice(0, 8).map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>
</section>`;
}

tick();
setInterval(tick, POLL_MS);
</script>
</body>
</html>
